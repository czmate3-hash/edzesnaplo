name: Edzesnaplo QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check auth-route.js
          node --check qa-fixes.js
          node --check sw.js
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest OK')"
      - name: Validate HTML references
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          for (const file of ['styles.css','auth-route.js','app.js','qa-fixes.js']) {
            if (!html.includes('./'+file)) throw new Error('Missing reference: '+file);
          }
          console.log('HTML references OK');
          NODE
